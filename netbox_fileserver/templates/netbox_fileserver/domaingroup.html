{% extends 'generic/object.html' %}
{% load helpers %}

{% block content %}
<div class="row">
  <div class="col col-md-6">
    <div class="card">
      <h2 class="card-header">Domain Group</h2>
      <table class="table table-hover attr-table">
        <tr><th scope="row">Name</th><td>{{ object.name }}</td></tr>
        <tr><th scope="row">Domain</th><td>{{ object.domain|linkify }}</td></tr>
        <tr><th scope="row">Description</th><td>{{ object.description|placeholder }}</td></tr>
      </table>
    </div>
    {% include 'inc/panels/custom_fields.html' %}
    {% include 'inc/panels/tags.html' %}
  </div>
</div>
{% endblock content %}
